name: generate metrics

on:
  schedule:
    - cron: "0 */12 * * *"   # 12時間ごとに再生成
  workflow_dispatch:          # 手動実行も可
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # 事前に PAT を作成し、リポジトリ Secret に METRICS_TOKEN として登録すること
          token: ${{ secrets.METRICS_TOKEN }}
          user: tkm112345
          filename: metrics.svg
          output_action: none        # main はPR必須の保護があるため直接pushさせない
          template: classic
          base: header, activity
          config_timezone: Asia/Tokyo

      - run: mkdir -p dist && mv metrics.svg dist/metrics.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: metrics     # 保護されていない専用ブランチに公開（snakeのoutputと同方式）
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
